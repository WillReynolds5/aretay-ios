name: Aretay
options:
  bundleIdPrefix: com.willreynolds
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  xcodeVersion: "16.3"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    CLANG_ENABLE_MODULES: YES
    ENABLE_MODULE_VERIFIER: YES

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: "2.5.1"

targets:
  Aretay:
    type: application
    platform: iOS
    sources:
      - path: Aretay
    configFiles:
      Debug: Config/Secrets.xcconfig
      Release: Config/Secrets.xcconfig
    entitlements:
      path: Aretay/Aretay.entitlements
      properties:
        com.apple.developer.applesignin:
          - Default
    info:
      path: Aretay/Info.plist
      properties:
        UILaunchScreen:
          UILaunchScreen: {}
        UIAppFonts:
          - Montserrat-Light.ttf
          - Montserrat-Medium.ttf
          - LibreCaslonText-Italic.ttf
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations~iphone:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Custom keys read by SupabaseConfig/MediaConfig — values come from Secrets.xcconfig
        SUPABASE_URL: "$(SUPABASE_URL)"
        SUPABASE_ANON_KEY: "$(SUPABASE_ANON_KEY)"
        R2_PUBLIC_BASE_URL: "$(R2_PUBLIC_BASE_URL)"
    dependencies:
      - package: Supabase
        product: Supabase
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.willreynolds.aretay
        PRODUCT_NAME: Aretay
        DEVELOPMENT_TEAM: R8GZ944C2L
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "0.1.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  AretayTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AretayTests
    dependencies:
      - target: Aretay
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.willreynolds.aretay.tests
        DEVELOPMENT_TEAM: R8GZ944C2L
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES

  AretayUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: AretayUITests
    dependencies:
      - target: Aretay
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.willreynolds.aretay.uitests
        DEVELOPMENT_TEAM: R8GZ944C2L
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Aretay:
    build:
      targets:
        Aretay: all
        AretayTests: [test]
        AretayUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - AretayTests
        - AretayUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
